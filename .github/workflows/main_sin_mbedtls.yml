name: Scene sin mb

on:
  workflow_dispatch:

jobs:
  all:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          #- platform: wiiu
          #  ext: wuhb
          - platform: switch
            ext: nro
          # - platform: 3ds
          #   ext: 3dsx
          #- platform: wii
          #  ext: dol
    container:
      image: ghcr.io/fortheusers/sealeo:evo
    steps:
    - uses: actions/checkout@main
      with:
        submodules: false
    - name: Inicializar submodules
      run: |
        git config --global --add safe.directory /__w/HbScene2/HbScene2
        git submodule update --init --recursive libs/librpxloader
    - if: matrix.platform == 'wii'
      name: Setup SDL2 Widescreen
      run: |
        git clone https://github.com/Fancy2209/SDL -b Widescreen
        cd SDL
        apt-get install ninja-build
        cmake -D CMAKE_TOOLCHAIN_FILE=/opt/devkitpro/cmake/Wii.cmake -B build -G Ninja
        cmake --build build --parallel
        cmake --install build
    - name: Build ${{ matrix.platform }}
      run: |
        if [ "${{ matrix.platform }}" = "switch" ]; then
          make switch
          make strip-switch-elf
        else
          make ${{ matrix.platform }}
        fi
    - uses: actions/upload-artifact@v4
      with:
        name: scene_eshop.${{ matrix.ext }}
        path: scene_eshop.${{ matrix.ext }}
    - if: matrix.platform == 'wiiu'
      uses: actions/upload-artifact@v4
      with:
        name: scene_eshop.rpx
        path: scene_eshop.rpx
