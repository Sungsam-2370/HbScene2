name: Scene Normal

on:
  workflow_dispatch:

jobs:
  all:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          #- platform: wiiu
          #  ext: wuhb
          - platform: switch
            ext: nro
          # - platform: 3ds
          #   ext: 3dsx
          #- platform: wii
          #  ext: dol
    container:
      image: ghcr.io/fortheusers/sealeo:evo
    steps:
    - uses: actions/checkout@main
      with:
        submodules: false
    - name: Inicializar submodules
      run: |
        git config --global --add safe.directory /__w/HbScene2/HbScene2
        git submodule update --init --recursive libs/librpxloader
    - if: matrix.platform == 'wii'
      name: Setup SDL2 Widescreen
      run: |
        git clone https://github.com/Fancy2209/SDL -b Widescreen
        cd SDL
        apt-get install ninja-build
        cmake -D CMAKE_TOOLCHAIN_FILE=/opt/devkitpro/cmake/Wii.cmake -B build -G Ninja
        cmake --build build --parallel
        cmake --install build
    - if: matrix.platform == 'switch'
      name: Instalar dependencias extra (mbedtls para instalacion de NSP/NSZ/XCI)
      run: |
        # Workaround: Cloudflare esta bloqueando con 403 el trafico de pacman
        # pensando que es trafico de bots de LLM (ver devkitPro/pacman#63).
        # El fix sugerido por el mantenedor de devkitPro es forzar un
        # User-Agent propio en el XferCommand de pacman.
        PACCONF=/opt/devkitpro/pacman/etc/pacman.conf
        if [ -f "$PACCONF" ]; then
          echo "--- pacman.conf antes ---"
          cat "$PACCONF"
          if ! grep -q "^XferCommand" "$PACCONF"; then
            sed -i '/^\[options\]/a XferCommand = /usr/bin/curl -A "dkp-pacman" -L -C - -f -o %o %u' "$PACCONF"
          fi
          echo "--- pacman.conf despues ---"
          cat "$PACCONF"
        else
          echo "AVISO: no encontre $PACCONF, reviso rutas alternativas"
          find /opt/devkitpro -iname 'pacman.conf' 2>/dev/null
        fi

        # Limpiar posibles DBs corruptas de un intento previo fallido
        rm -f /opt/devkitpro/pacman/var/lib/pacman/sync/dkp-li* \
              /opt/devkitpro/pacman/var/lib/pacman/sync/dkp-lin* 2>/dev/null || true

        n=0
        until [ "$n" -ge 5 ]
        do
          dkp-pacman --noconfirm -Sy switch-mbedtls && break
          n=$((n+1))
          echo "Intento $n fallo (probablemente 403 de Cloudflare), reintentando en 10s..."
          sleep 10
        done

        # Si tras los reintentos sigue sin estar instalado, que falle el job
        # aca mismo con un mensaje claro en vez de fallar mas adelante en el
        # link con un "cannot find -lmbedtls" confuso.
        pacman -Q switch-mbedtls 2>/dev/null || dkp-pacman -Q switch-mbedtls
    - name: Build ${{ matrix.platform }}
      run: |
        if [ "${{ matrix.platform }}" = "switch" ]; then
          make switch
          make strip-switch-elf
        else
          make ${{ matrix.platform }}
        fi
    - uses: actions/upload-artifact@v4
      with:
        name: scene_eshop.${{ matrix.ext }}
        path: scene_eshop.${{ matrix.ext }}
    - if: matrix.platform == 'wiiu'
      uses: actions/upload-artifact@v4
      with:
        name: scene_eshop.rpx
        path: scene_eshop.rpx
