name: Scene elf

on:
  workflow_dispatch:

jobs:
  all:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          #- platform: wiiu
          #  ext: wuhb
          - platform: switch
            ext: nro
          # - platform: 3ds
          #   ext: 3dsx
          #- platform: wii
          #  ext: dol
    container:
      image: ghcr.io/fortheusers/sealeo:evo
    steps:
    - uses: actions/checkout@main
      with:
        submodules: false
    - name: Inicializar submodules
      run: |
        git config --global --add safe.directory /__w/HbScene2/HbScene2
        git submodule update --init --recursive libs/librpxloader
    - if: matrix.platform == 'wii'
      name: Setup SDL2 Widescreen
      run: |
        git clone https://github.com/Fancy2209/SDL -b Widescreen
        cd SDL
        apt-get install ninja-build
        cmake -D CMAKE_TOOLCHAIN_FILE=/opt/devkitpro/cmake/Wii.cmake -B build -G Ninja
        cmake --build build --parallel
        cmake --install build
    - if: matrix.platform == 'switch'
      name: Instalar dependencias extra (mbedtls para auto-instalacion de NSP)
      run: |
        dkp-pacman --noconfirm -Sy switch-mbedtls
    - name: Build ${{ matrix.platform }}
      run: |
        if [ "${{ matrix.platform }}" = "switch" ]; then
          make switch
        else
          make ${{ matrix.platform }}
        fi
    - if: matrix.platform == 'switch'
      uses: actions/upload-artifact@v4
      with:
        # .elf SIN stripear -- indispensable para poder correr addr2line
        # sobre los crash logs (los offsets "scene_eshop + 0x..." no sirven
        # de nada sin este archivo). No se puede regenerar despues: una vez
        # que se pierde este artifact de una build especifica, ya no hay
        # forma de resolver los crashes de ESA build en particular.
        name: scene_eshop_switch.elf
        path: scene_eshop_switch.elf
    - if: matrix.platform == 'switch'
      name: Quitar simbolos de depuracion del elf (no afecta al .nro final)
      run: make strip-switch-elf
    - uses: actions/upload-artifact@v4
      with:
        name: scene_eshop.${{ matrix.ext }}
        path: scene_eshop.${{ matrix.ext }}
    - if: matrix.platform == 'wiiu'
      uses: actions/upload-artifact@v4
      with:
        name: scene_eshop.rpx
        path: scene_eshop.rpx
