name: Scene Normal

on:
  workflow_dispatch:

jobs:
  all:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          #- platform: wiiu
          #  ext: wuhb
          - platform: switch
            ext: nro
          # - platform: 3ds
          #   ext: 3dsx
          #- platform: wii
          #  ext: dol
    container:
      image: ghcr.io/fortheusers/sealeo:evo
    steps:
    - uses: actions/checkout@main
      with:
        submodules: false
    - name: Inicializar submodules
      run: |
        git config --global --add safe.directory /__w/HbScene2/HbScene2
        git submodule update --init --recursive libs/librpxloader
    - if: matrix.platform == 'wii'
      name: Setup SDL2 Widescreen
      run: |
        git clone https://github.com/Fancy2209/SDL -b Widescreen
        cd SDL
        apt-get install ninja-build
        cmake -D CMAKE_TOOLCHAIN_FILE=/opt/devkitpro/cmake/Wii.cmake -B build -G Ninja
        cmake --build build --parallel
        cmake --install build
    - if: matrix.platform == 'switch'
      name: Cache de switch-mbedtls
      id: cache-mbedtls
      uses: actions/cache@v4
      with:
        path: |
          /opt/devkitpro/portlibs/switch/lib/libmbedtls.a
          /opt/devkitpro/portlibs/switch/lib/libmbedx509.a
          /opt/devkitpro/portlibs/switch/lib/libmbedcrypto.a
          /opt/devkitpro/portlibs/switch/include/mbedtls
        key: switch-mbedtls-v1

    # Este paso solo corre si el cache de arriba NO tuvo un hit, es decir,
    # la primera vez (o si el cache se invalida/borra). Una vez que logre
    # bajar el paquete una sola vez, las corridas siguientes usan el cache
    # de arriba y ni siquiera intentan pegarle a pkg.devkitpro.org.
    - if: matrix.platform == 'switch' && steps.cache-mbedtls.outputs.cache-hit != 'true'
      name: Instalar dependencias extra (mbedtls para instalacion de NSP/NSZ/XCI)
      run: |
        # ATENCION: pkg.devkitpro.org esta devolviendo 403 en masa porque
        # Cloudflare esta confundiendo trafico normal de pacman con bots de
        # LLM (ver devkitPro/pacman#63, confirmado por el mantenedor
        # WinterMute). Le pasa hasta a gente en su casa, no es cosa nuestra
        # ni del codigo del proyecto. Probamos con curl y wget, con un
        # User-Agent propio, alternando entre intentos, con backoff largo,
        # por si el bloqueo es intermitente. Si sigue fallando tras todos
        # los intentos, hay que esperar a que devkitPro lo resuelva de su
        # lado (o conseguir el .pkg.tar.zst por otra via y cachearlo a mano,
        # ver nota al final).
        PACCONF=/opt/devkitpro/pacman/etc/pacman.conf
        if [ -f "$PACCONF" ] && ! grep -q "^XferCommand" "$PACCONF"; then
          sed -i '/^\[options\]/a XferCommand = /usr/bin/curl -A "dkp-pacman" -L -C - -f -o %o %u' "$PACCONF"
        fi

        rm -f /opt/devkitpro/pacman/var/lib/pacman/sync/dkp-li* 2>/dev/null || true

        ok=0
        for n in 1 2 3 4 5 6 7 8; do
          # Alternamos el XferCommand entre curl y wget en cada intento,
          # por si uno de los dos evade el bloqueo de Cloudflare mejor.
          if [ $((n % 2)) -eq 0 ]; then
            sed -i "s|^XferCommand.*|XferCommand = /usr/bin/wget -U \"dkp-pacman\" --passive-ftp -c -O %o %u|" "$PACCONF"
          else
            sed -i "s|^XferCommand.*|XferCommand = /usr/bin/curl -A \"dkp-pacman\" -L -C - -f -o %o %u|" "$PACCONF"
          fi

          if dkp-pacman --noconfirm -Sy switch-mbedtls; then
            ok=1
            break
          fi
          echo "Intento $n/8 fallo (403 probable de Cloudflare, ver devkitPro/pacman#63), reintentando..."
          sleep 20
        done

        if [ "$ok" -ne 1 ]; then
          echo "::error::No se pudo instalar switch-mbedtls tras 8 intentos. Esto es un problema de infraestructura de devkitPro (pkg.devkitpro.org devolviendo 403), no del codigo del proyecto. Revisa https://github.com/devkitPro/pacman/issues/63 para el estado. Como alternativa, se puede subir el .pkg.tar.zst a un release propio y extraerlo a mano en este paso."
          exit 1
        fi
    - name: Build ${{ matrix.platform }}
      run: |
        if [ "${{ matrix.platform }}" = "switch" ]; then
          make switch
          make strip-switch-elf
        else
          make ${{ matrix.platform }}
        fi
    - uses: actions/upload-artifact@v4
      with:
        name: scene_eshop.${{ matrix.ext }}
        path: scene_eshop.${{ matrix.ext }}
    - if: matrix.platform == 'wiiu'
      uses: actions/upload-artifact@v4
      with:
        name: scene_eshop.rpx
        path: scene_eshop.rpx
